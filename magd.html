    <!-- Project 2 -->
    <div class="project-card"
      data-title="Sandwitch Souls Game"
      data-description="2D Dark Souls-inspired Unity game with combat, movement, and basic Ai. This was my project that was teaching me the basics of Unity and C#. I created a small prototype of a 2D dark souls-inspired game that includes basic combat mechanics, player movement, and simple AI enemies. The game features a pixel art style and is designed to be a fun and challenging experience for players who enjoy action games."
      data-media="images/Photos/Sandwitch_1.png "

      <img src="images/Photos/Sandwitch_1.png" alt="">
      <img src="images/Photos/Sandwitch_2.png" alt="">
      <img src="images/Photos/Sandwitch_3.png" alt="">  
      <h3>Sandwitch Souls Game</h3>
    </div>

    <!-- Project 3 -->
    <div class="project-card"
      data-title="488 MAGD In Progress"

      data-media="images/Photos/public-domain-vectors-V7D6s4B-LP4-unsplash.png">

      <img src="images/Photos/public-domain-vectors-V7D6s4B-LP4-unsplash.png" alt="">
      <h3>488 MAGD In Progress</h3>
    </div>

    <!-- Project 4 (VIDEO) -->

      data-title="Unity Based Inventory System"
      data-description="Unity inventory system with database integration. This project is a Unity-based inventory system that integrates with a database to manage item storage and retrieval. This cna run in the runtime and allows for dynamic item management, including adding, and updating items in the inventory. The system is designed to be flexible and scalable, making it suitable for various types of games that require inventory management."
      data-media="images/Videos/487Vid.mp4">

      <video class="project-video" muted loop autoplay>
        <source src="images/Videos/487Vid.mp4" type="video/mp4">
      </video>

<!-- MODAL -->

<script>
document.querySelectorAll(".project-card").forEach(card => {
  card.addEventListener("click", () => {
    const title = card.dataset.title;
    const description = card.dataset.description;
    const mediaSrc = card.dataset.media;

    document.getElementById("modalTitle").innerText = title;
    document.getElementById("modalDescription").innerText = description;

    const mediaContainer = document.getElementById("modalMedia");
    mediaContainer.innerHTML = "";

    if (mediaSrc.endsWith(".mp4")) {
      mediaContainer.innerHTML = `
        <video controls autoplay loop>
          <source src="${mediaSrc}" type="video/mp4">
        </video>
      `;
    } else {
      mediaContainer.innerHTML = `
        <img src="${mediaSrc}">
      `;
    }

    document.getElementById("projectModal").style.display = "flex";
  });
});

function closeProject() {
  document.getElementById("projectModal").style.display = "none";
}
</script>

</body>
